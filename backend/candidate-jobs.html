<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find Jobs | HireFlow</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #17233c;
        }


        /* ==============================
           HEADER
        ============================== */

        .topbar {

            height: 80px;

            background: white;

            border-bottom:
                1px solid #e5e8ef;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

        }


        .logo {

            font-size: 28px;

            font-weight: 800;

            color: #6947ff;

        }


        .back-btn {

            border:
                1px solid #dfe3eb;

            background: white;

            color: #17233c;

            padding:
                11px 20px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

        }


        .back-btn:hover {
            background: #f5f2ff;
        }


        /* ==============================
           MAIN
        ============================== */

        .container {

            width:
                min(1100px, 92%);

            margin:
                45px auto;

        }


        .page-header {

            margin-bottom: 28px;

        }


        .page-header h1 {

            margin:
                0 0 8px;

            font-size: 38px;

        }


        .page-header p {

            margin: 0;

            color: #68758a;

            font-size: 16px;

        }


        /* ==============================
           SEARCH
        ============================== */

        .search-card {

            background: white;

            border:
                1px solid #e3e7ef;

            border-radius: 18px;

            padding: 22px;

            margin-bottom: 30px;

        }


        .search-row {

            display: grid;

            grid-template-columns:
                1.5fr 1fr 1fr auto;

            gap: 12px;

        }


        .search-input {

            width: 100%;

            border:
                1px solid #dfe4ed;

            border-radius: 10px;

            padding:
                13px 14px;

            font-size: 14px;

            outline: none;

            background: white;

        }


        .search-input:focus {

            border-color:
                #6947ff;

        }


        .search-btn {

            border: none;

            background:
                #6947ff;

            color: white;

            padding:
                13px 22px;

            border-radius: 10px;

            font-weight: 700;

            cursor: pointer;

        }


        .clear-btn {

            margin-top: 12px;

            border: none;

            background: transparent;

            color: #6947ff;

            font-weight: 700;

            cursor: pointer;

        }


        /* ==============================
           JOB HEADER
        ============================== */

        .jobs-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 18px;

        }


        .jobs-header h2 {

            margin: 0;

            font-size: 24px;

        }


        #jobsCount {

            color: #68758a;

            font-size: 14px;

        }


        /* ==============================
           JOB LIST
        ============================== */

        #jobList {

            display: flex;

            flex-direction: column;

            gap: 18px;

        }


        .job-card {

            background: white;

            border:
                1px solid #e3e7ef;

            border-radius: 16px;

            padding: 24px;

            box-shadow:
                0 4px 18px
                rgba(30, 40, 70, 0.04);

        }


        .job-card h2 {

            margin:
                0 0 6px;

            font-size: 21px;

        }


        .job-company {

            color:
                #6947ff;

            font-weight: 700;

            margin-bottom: 15px;

        }


        .job-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 15px;

        }


        .job-meta span {

            background:
                #f1efff;

            color:
                #5d43d2;

            padding:
                6px 10px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: 700;

        }


        .job-description {

            color:
                #68758a;

            line-height: 1.6;

            font-size: 14px;

            margin-bottom: 16px;

        }


        .job-skills {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-bottom: 18px;

        }


        .skill-tag {

            background:
                #faf9ff;

            color:
                #6046d8;

            border:
                1px solid #ddd8ff;

            padding:
                5px 9px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 700;

        }


        .job-actions {

            display: flex;

            justify-content: flex-start;

        }


        .apply-button {

            border: none;

            background:
                #6947ff;

            color: white;

            padding:
                11px 20px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

        }


        .apply-button:hover {

            background:
                #5b3ce0;

        }


        .apply-button.applied {

            background:
                #16834c;

            cursor: default;

        }


        .loading,
        .empty-state,
        .error-state {

            background: white;

            border:
                1px solid #e3e7ef;

            border-radius: 16px;

            padding: 55px 25px;

            text-align: center;

            color: #68758a;

        }


        .empty-icon {

            font-size: 42px;

            margin-bottom: 10px;

        }


        .empty-state h3,
        .error-state h3 {

            color: #17233c;

            margin:
                0 0 8px;

        }


        @media (max-width: 800px) {

            .search-row {

                grid-template-columns:
                    1fr;

            }


            .page-header h1 {

                font-size: 30px;

            }

        }


        @media (max-width: 500px) {

            .topbar {

                padding: 0 4%;

            }

            .container {

                width: 92%;

            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        HireFlow
    </div>


    <button
        class="back-btn"
        id="backButton"
        type="button"
    >
        ← Dashboard
    </button>

</header>


<main class="container">


    <div class="page-header">

        <h1>
            Find Jobs
        </h1>

        <p>
            Discover opportunities that match your skills and career goals.
        </p>

    </div>


    <!-- SEARCH -->

    <section class="search-card">

        <div class="search-row">

            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="Search jobs, companies or skills..."
            >


            <input
                id="locationInput"
                class="search-input"
                type="text"
                placeholder="Location"
            >


            <select
                id="typeInput"
                class="search-input"
            >

                <option value="">
                    All job types
                </option>

                <option value="full-time">
                    Full-time
                </option>

                <option value="part-time">
                    Part-time
                </option>

                <option value="internship">
                    Internship
                </option>

                <option value="contract">
                    Contract
                </option>

                <option value="freelance">
                    Freelance
                </option>

            </select>


            <button
                class="search-btn"
                id="searchButton"
                type="button"
            >
                Search
            </button>

        </div>


        <button
            class="clear-btn"
            id="clearButton"
            type="button"
        >
            Clear filters
        </button>

    </section>


    <!-- JOB HEADER -->

    <div class="jobs-header">

        <h2>
            Available Jobs
        </h2>

        <div id="jobsCount">
            Loading...
        </div>

    </div>


    <!-- THIS WAS MISSING -->

    <div id="jobList">

        <div class="loading">
            Loading jobs...
        </div>

    </div>


</main>


<script>


// ============================================================
// API
// ============================================================

const API_URL = "/api";


// ============================================================
// GET USER ID
// ============================================================

function getLoggedInCandidateId() {

    const keys = [

        "hireflowUser",

        "user",

        "loggedInUser",

        "currentUser"

    ];


    for (
        const key of keys
    ) {

        const stored =
            localStorage.getItem(key);


        if (!stored) {
            continue;
        }


        try {

            const user =
                JSON.parse(stored);


            const id =
                user.id ||
                user._id;


            if (id) {

                return String(id);

            }

        }

        catch (error) {

            console.error(
                error
            );

        }

    }


    return null;

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ============================================================
// LOAD JOBS
// ============================================================

async function loadJobs() {

    const jobList =
        document.getElementById(
            "jobList"
        );


    jobList.innerHTML = `

        <div class="loading">
            Loading jobs...
        </div>

    `;


    try {

        const response =
            await fetch(
                `${API_URL}/jobs`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load jobs."
            );

        }


        const jobs =
            Array.isArray(data.jobs)
                ? data.jobs
                : [];


        renderJobs(
            jobs
        );

    }


    catch (error) {

        console.error(
            "Load jobs error:",
            error
        );


        jobList.innerHTML = `

            <div class="error-state">

                <h3>
                    Unable to load jobs
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


// ============================================================
// FILTER
// ============================================================

function filterJobs(
    jobs
) {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const location =
        document
            .getElementById(
                "locationInput"
            )
            .value
            .trim()
            .toLowerCase();


    const type =
        document
            .getElementById(
                "typeInput"
            )
            .value
            .trim()
            .toLowerCase();


    return jobs.filter(
        job => {

            const title =
                String(
                    job.title ||
                    job.jobTitle ||
                    ""
                )
                .toLowerCase();


            const company =
                String(
                    job.company ||
                    ""
                )
                .toLowerCase();


            const description =
                String(
                    job.description ||
                    ""
                )
                .toLowerCase();


            const jobLocation =
                String(
                    job.location ||
                    ""
                )
                .toLowerCase();


            const jobType =
                String(
                    job.jobType ||
                    ""
                )
                .toLowerCase();


            const skills =
                Array.isArray(
                    job.skills
                )
                    ? job.skills
                        .join(" ")
                        .toLowerCase()
                    : String(
                        job.skills ||
                        ""
                    ).toLowerCase();


            const matchesSearch =
                !search ||
                title.includes(search) ||
                company.includes(search) ||
                description.includes(search) ||
                skills.includes(search);


            const matchesLocation =
                !location ||
                jobLocation.includes(
                    location
                );


            const matchesType =
                !type ||
                jobType === type;


            return (
                matchesSearch &&
                matchesLocation &&
                matchesType
            );

        }
    );

}


// ============================================================
// RENDER JOBS
// ============================================================

async function renderJobs(
    jobs
) {

    const jobList =
        document.getElementById(
            "jobList"
        );


    const filteredJobs =
        filterJobs(
            jobs
        );


    document.getElementById(
        "jobsCount"
    ).textContent =
        `${filteredJobs.length} job${
            filteredJobs.length === 1
                ? ""
                : "s"
        } found`;


    if (
        filteredJobs.length === 0
    ) {

        jobList.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    💼
                </div>

                <h3>
                    No jobs found
                </h3>

                <p>
                    Try changing your search or filters.
                </p>

            </div>

        `;

        return;

    }


    jobList.innerHTML = "";


    for (
        const job of filteredJobs
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "job-card";


        const title =
            job.title ||
            job.jobTitle ||
            "Job Opportunity";


        const company =
            job.company ||
            "Company";


        const location =
            job.location ||
            "Location not specified";


        const type =
            job.jobType ||
            "Full-time";


        const salary =
            job.salary ||
            "Salary not specified";


        const experience =
            job.experience ||
            "Experience not specified";


        const description =
            job.description ||
            "No description available.";


        const skills =
            Array.isArray(job.skills)
                ? job.skills
                : [];


        card.innerHTML = `

            <h2>
                ${escapeHtml(title)}
            </h2>

            <div class="job-company">
                ${escapeHtml(company)}
            </div>


            <div class="job-meta">

                <span>
                    📍 ${escapeHtml(location)}
                </span>

                <span>
                    💼 ${escapeHtml(type)}
                </span>

                <span>
                    💰 ${escapeHtml(salary)}
                </span>

                <span>
                    🎓 ${escapeHtml(experience)}
                </span>

            </div>


            <div class="job-description">
                ${escapeHtml(description)}
            </div>


            ${
                skills.length
                    ? `

                        <div class="job-skills">

                            ${skills.map(
                                skill => `
                                    <span class="skill-tag">
                                        ${escapeHtml(skill)}
                                    </span>
                                `
                            ).join("")}

                        </div>

                    `
                    : ""
            }


            <div class="job-actions">

                <button
                    class="apply-button"
                    type="button"
                >
                    Apply Now →
                </button>

            </div>

        `;


        const button =
            card.querySelector(
                ".apply-button"
            );


        button.addEventListener(
            "click",
            function () {

                applyForJob(
                    job,
                    button
                );

            }
        );


        jobList.appendChild(
            card
        );


        // Check if already applied

        checkApplication(
            job._id,
            button
        );

    }

}


// ============================================================
// APPLY
// ============================================================

async function applyForJob(
    job,
    button
) {

    const candidateId =
        getLoggedInCandidateId();


    if (!candidateId) {

        alert(
            "Please login again before applying."
        );

        return;

    }


    if (
        !job ||
        !job._id
    ) {

        alert(
            "Job ID is missing."
        );

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "Applying...";


    try {

        const response =
            await fetch(
                `${API_URL}/applications`,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            candidateId:
                                candidateId,

                            jobId:
                                job._id,

                            coverMessage:
                                ""

                        })

                }
            );


        const data =
            await response.json();


        if (
            response.status === 409 ||
            data.alreadyApplied
        ) {

            setApplied(
                button
            );

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Application failed."
            );

        }


        setApplied(
            button
        );


        alert(
            "Application submitted successfully! 🎉"
        );


    }

    catch (error) {

        console.error(
            "Application error:",
            error
        );


        button.disabled =
            false;


        button.textContent =
            "Apply Now →";


        alert(
            error.message ||
            "Unable to submit application."
        );

    }

}


// ============================================================
// CHECK APPLICATION
// ============================================================

async function checkApplication(
    jobId,
    button
) {

    const candidateId =
        getLoggedInCandidateId();


    if (
        !candidateId ||
        !jobId
    ) {

        return;

    }


    try {

        const response =
            await fetch(

                `${API_URL}/applications/check/` +
                `${encodeURIComponent(candidateId)}/` +
                `${encodeURIComponent(jobId)}`

            );


        const data =
            await response.json();


        if (
            response.ok &&
            data.success &&
            data.applied
        ) {

            setApplied(
                button
            );

        }

    }

    catch (error) {

        console.error(
            "Application check error:",
            error
        );

    }

}


// ============================================================
// SET APPLIED
// ============================================================

function setApplied(
    button
) {

    button.textContent =
        "✓ Applied";


    button.classList.add(
        "applied"
    );


    button.disabled =
        true;

}


// ============================================================
// SEARCH
// ============================================================

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(
        "click",
        loadJobs
    );


document
    .getElementById(
        "typeInput"
    )
    .addEventListener(
        "change",
        loadJobs
    );


// ============================================================
// ENTER KEY
// ============================================================

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                loadJobs();

            }

        }
    );


document
    .getElementById(
        "locationInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                loadJobs();

            }

        }
    );


// ============================================================
// CLEAR
// ============================================================

document
    .getElementById(
        "clearButton"
    )
    .addEventListener(
        "click",
        function () {

            document
                .getElementById(
                    "searchInput"
                )
                .value = "";


            document
                .getElementById(
                    "locationInput"
                )
                .value = "";


            document
                .getElementById(
                    "typeInput"
                )
                .value = "";


            loadJobs();

        }
    );


// ============================================================
// BACK
// ============================================================

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function () {

            window.history.back();

        }
    );


// ============================================================
// START
// ============================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadJobs();

    }
);

</script>

</body>
</html>
