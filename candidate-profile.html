<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HireFlow - Public Profile</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Inter,
                Arial,
                sans-serif;

            background:
                #f5f7fb;

            color:
                #172033;

            min-height:
                100vh;

        }


        /* =========================================
           TOP BAR
        ========================================== */

        .topbar {

            height:
                72px;

            background:
                #ffffff;

            border-bottom:
                1px solid #e8ebf2;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 7%;

            position:
                sticky;

            top:
                0;

            z-index:
                10;

        }


        .brand {

            font-size:
                22px;

            font-weight:
                800;

            color:
                #6d4aff;

        }


        .top-actions {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .top-button {

            border:
                1px solid #dfe3ec;

            background:
                #ffffff;

            padding:
                10px 17px;

            border-radius:
                10px;

            cursor:
                pointer;

            font-weight:
                600;

            color:
                #30384d;

        }


        .top-button:hover {

            background:
                #f6f4ff;

        }


        .copy-button {

            background:
                #6d4aff;

            color:
                #ffffff;

            border:
                1px solid #6d4aff;

        }


        .copy-button:hover {

            background:
                #5c3be0;

        }


        /* =========================================
           PAGE
        ========================================== */

        .page {

            width:
                min(1100px, 92%);

            margin:
                35px auto 60px;

        }


        /* =========================================
           HERO
        ========================================== */

        .profile-hero {

            background:
                #ffffff;

            border-radius:
                20px;

            padding:
                35px;

            display:
                flex;

            align-items:
                center;

            gap:
                28px;

            border:
                1px solid #e8ebf2;

            box-shadow:
                0 8px 30px rgba(
                    25,
                    35,
                    55,
                    0.05
                );

        }


        .avatar {

            width:
                120px;

            height:
                120px;

            min-width:
                120px;

            border-radius:
                50%;

            background:
                #6d4aff;

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                42px;

            font-weight:
                700;

            overflow:
                hidden;

        }


        .avatar img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

        }


        .hero-content {

            flex:
                1;

        }


        .hero-content h1 {

            font-size:
                34px;

            margin-bottom:
                8px;

        }


        .headline {

            color:
                #6d4aff;

            font-size:
                18px;

            font-weight:
                600;

            margin-bottom:
                12px;

        }


        .location {

            color:
                #697386;

            font-size:
                15px;

        }


        /* =========================================
           COMPLETION
        ========================================== */

        .profile-status {

            text-align:
                center;

            min-width:
                130px;

        }


        .completion-circle {

            width:
                76px;

            height:
                76px;

            border-radius:
                50%;

            border:
                7px solid #6d4aff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin:
                auto;

            font-weight:
                800;

        }


        .profile-status small {

            display:
                block;

            margin-top:
                8px;

            color:
                #697386;

        }


        /* =========================================
           GRID
        ========================================== */

        .grid {

            display:
                grid;

            grid-template-columns:
                2fr 1fr;

            gap:
                22px;

            margin-top:
                22px;

        }


        /* =========================================
           CARDS
        ========================================== */

        .card {

            background:
                #ffffff;

            border:
                1px solid #e8ebf2;

            border-radius:
                18px;

            padding:
                25px;

            box-shadow:
                0 8px 25px rgba(
                    25,
                    35,
                    55,
                    0.04
                );

        }


        .card + .card {

            margin-top:
                22px;

        }


        .card h2 {

            font-size:
                19px;

            margin-bottom:
                18px;

        }


        /* =========================================
           ABOUT / GOAL
        ========================================== */

        .about,
        .goal {

            color:
                #596276;

            line-height:
                1.7;

            white-space:
                pre-wrap;

        }


        /* =========================================
           SKILLS
        ========================================== */

        .skill-list {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                9px;

        }


        .skill {

            background:
                #f0edff;

            color:
                #6244d8;

            padding:
                8px 13px;

            border-radius:
                20px;

            font-size:
                14px;

            font-weight:
                600;

        }


        /* =========================================
           EDUCATION
        ========================================== */

        .education-item {

            padding:
                16px 0;

            border-bottom:
                1px solid #edf0f5;

        }


        .education-item:last-child {

            border-bottom:
                none;

        }


        .education-degree {

            font-weight:
                700;

            font-size:
                16px;

        }


        .education-college {

            color:
                #697386;

            margin-top:
                5px;

        }


        .education-year {

            color:
                #6d4aff;

            font-size:
                13px;

            margin-top:
                5px;

            font-weight:
                600;

        }


        /* =========================================
           CONTACT
        ========================================== */

        .contact-item {

            margin-bottom:
                15px;

        }


        .contact-label {

            color:
                #8a92a3;

            font-size:
                12px;

            text-transform:
                uppercase;

            letter-spacing:
                .5px;

            margin-bottom:
                4px;

        }


        .contact-value {

            color:
                #30384d;

            word-break:
                break-word;

        }


        /* =========================================
           RESUME
        ========================================== */

        .resume-box {

            background:
                #f7f8fc;

            border-radius:
                12px;

            padding:
                15px;

        }


        .resume-name {

            font-weight:
                700;

            word-break:
                break-word;

            margin-bottom:
                12px;

        }


        .resume-button {

            display:
                inline-block;

            background:
                #6d4aff;

            color:
                #ffffff;

            text-decoration:
                none;

            padding:
                10px 15px;

            border-radius:
                9px;

            font-size:
                14px;

            font-weight:
                600;

        }


        /* =========================================
           EMPTY
        ========================================== */

        .empty {

            color:
                #8a92a3;

            font-size:
                14px;

        }


        /* =========================================
           LOADING / ERROR
        ========================================== */

        .loading {

            text-align:
                center;

            padding:
                100px 20px;

            color:
                #697386;

        }


        .error {

            text-align:
                center;

            padding:
                80px 20px;

            color:
                #d33b4a;

        }


        /* =========================================
           COPY MESSAGE
        ========================================== */

        .copy-message {

            position:
                fixed;

            left:
                50%;

            bottom:
                30px;

            transform:
                translateX(-50%);

            background:
                #172033;

            color:
                #ffffff;

            padding:
                13px 20px;

            border-radius:
                10px;

            font-size:
                14px;

            font-weight:
                600;

            box-shadow:
                0 8px 30px rgba(
                    0,
                    0,
                    0,
                    0.2
                );

            opacity:
                0;

            pointer-events:
                none;

            transition:
                opacity .25s ease;

            z-index:
                100;

        }


        .copy-message.show {

            opacity:
                1;

        }


        /* =========================================
           RESPONSIVE
        ========================================== */

        @media (
            max-width: 800px
        ) {

            .topbar {

                padding:
                    0 4%;

            }


            .profile-hero {

                flex-direction:
                    column;

                text-align:
                    center;

            }


            .grid {

                grid-template-columns:
                    1fr;

            }


            .profile-status {

                margin-top:
                    5px;

            }


            .top-actions {

                gap:
                    5px;

            }


            .top-button {

                padding:
                    9px 11px;

                font-size:
                    12px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <header class="topbar">

        <div class="brand">
            HireFlow
        </div>


        <div class="top-actions">

            <button
                class="top-button copy-button"
                id="copyProfileButton"
                type="button"
            >
                🔗 Copy Profile Link
            </button>


            <button
                class="top-button"
                id="backButton"
                type="button"
            >
                ← Back to Profile
            </button>

        </div>

    </header>


    <!-- =========================================
         MAIN PAGE
    ========================================== -->

    <main class="page">


        <div
            id="loading"
            class="loading"
        >
            Loading profile...
        </div>


        <div
            id="error"
            class="error"
            style="display:none;"
        >
            Unable to load profile.
        </div>


        <div
            id="profile"
            style="display:none;"
        >


            <!-- =====================================
                 HERO
            ====================================== -->

            <section class="profile-hero">


                <div
                    class="avatar"
                    id="profileAvatar"
                >
                    C
                </div>


                <div class="hero-content">

                    <h1 id="profileName">
                        Candidate
                    </h1>


                    <div
                        class="headline"
                        id="profileHeadline"
                    >
                        Professional
                    </div>


                    <div
                        class="location"
                        id="profileLocation"
                    >
                        Location not added
                    </div>

                </div>


                <div class="profile-status">

                    <div
                        class="completion-circle"
                        id="completionPercent"
                    >
                        0%
                    </div>


                    <small>
                        Profile Complete
                    </small>

                </div>

            <!-- =====================================

            ====================================== -->

            <div class="grid">


                <!-- =================================
                     LEFT COLUMN
                ================================== -->

                <div>


                    <!-- ABOUT -->

                    <section class="card">

                        <h2>
                            About
                        </h2>


                        <p
                            class="about"
                            id="profileAbout"

                        </p>

                    </section>


                    <!-- CAREER GOAL -->

                    <section class="card">

                        <h2>
                            Career Goal
                        </h2>


                        <p
                            class="goal"

                            No career goal added yet.
                        </p>

                    <!-- SKILLS -->

                    <section class="card">

                        <h2>
                            Skills
                        </h2>


                        <div
                            class="skill-list"
                            id="skillsList"
                        >
                        </div>

                    <section class="card">

                        <h2>

                            id="educationList"
                        >

                     RIGHT COLUMN
                ================================== -->

                <div>


                    <!-- CONTACT -->

                    <section class="card">

                        <h2>
                            Contact
                        </h2>


                        <div class="contact-item">

                            <div class="contact-label">
                                Email
                            </div>


                            <div
                                class="contact-value"
                                id="profileEmail"

                                -

                        <div class="contact-item">

                            <div class="contact-label">
                                Phone
                            </div>


                            <div
                                class="contact-value"
                                id="profilePhone"
                            >
                                -
                            </div>

                        </div>


                        <div class="contact-item">

                            <div class="contact-label">
                                Location
                            </div>


                            <div
                                class="contact-value"
                                id="profileLocationSide"

                                -

    <!-- =========================================
         COPY SUCCESS MESSAGE
    ========================================== -->

    <div
        class="copy-message"
        id="copyMessage"
    >
        ✓ Profile link copied!
    </div>


<script>


// =====================================================
// API
// =====================================================

const API_URL =
    "http://localhost:5000/api";


// =====================================================
// GET LOGGED-IN USER
// =====================================================

function getLoggedInUser() {

    const keys = [

        "hireflowUser",
        "user",
        "loggedInUser",
        "currentUser"

    ];


    for (
        const key of keys
    ) {

        const stored =
            localStorage.getItem(
                key
            );


        if (!stored) {

            continue;

        }


        try {

            const user =
                JSON.parse(
                    stored
                );


            if (
                user &&
                (
                    user.id ||
                    user._id
                )
            ) {

                return user;

            }

        }

        catch (error) {

            console.error(
                error
            );

        }

    }


    return null;

}


// =====================================================
// GET USER ID
// =====================================================

function getUserId() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const urlUserId =
        params.get("id");


    if (urlUserId) {

        return urlUserId;

    }


    const user =
        getLoggedInUser();


    if (!user) {

        return null;

    }


    return (
        user.id ||
        user._id
    );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================================
// FILE URL
// =====================================================

function getFileUrl(
    file
) {

    if (
        !file ||
        !file.path
    ) {

        return "";

    }


    const value =
        String(
            file.path
        );


    if (
        value.startsWith(
            "http://"
        ) ||
        value.startsWith(
            "https://"
        )
    ) {

        return value;

    }


    return (
        "http://localhost:5000" +
        (
            value.startsWith("/")
                ? ""
                : "/"
        ) +
        value
    );

}


// =====================================================
// PROFILE COMPLETION
// =====================================================

function calculateCompletion(
    profile
) {

    let percentage =
        0;


    if (
        profile.name &&
        profile.email
    ) {

        percentage += 15;

    }


    if (
        profile.phone &&
        profile.location
    ) {

        percentage += 10;

    }


    if (
        profile.headline
    ) {

        percentage += 15;

    }


    if (
        profile.about
    ) {

        percentage += 15;

    }


    if (
        profile.careerGoal
    ) {

        percentage += 10;

    }


    if (
        Array.isArray(
            profile.skills
        ) &&
        profile.skills.length
    ) {

        percentage += 10;

    }


    if (
        Array.isArray(
            profile.education
        ) &&
        profile.education.length
    ) {

        percentage += 10;

    }


    if (
        profile.resume &&
        profile.resume.path
    ) {

        percentage += 10;

    }


    if (
        profile.profilePhoto &&
        profile.profilePhoto.path
    ) {

        percentage += 5;

    }


    return percentage;

}


// =====================================================
// RENDER PROFILE
// =====================================================

function renderProfile(
    profile
) {

    const name =
        profile.name ||
        "Candidate";


    // NAME

    document.getElementById(
        "profileName"
    ).textContent =
        name;


    // HEADLINE

    document.getElementById(
        "profileHeadline"
    ).textContent =
        profile.headline ||
        "Professional";


    // LOCATION

    document.getElementById(
        "profileLocation"
    ).textContent =
        profile.location ||
        "Location not added";


    document.getElementById(
        "profileLocationSide"
    ).textContent =
        profile.location ||
        "-";


    // EMAIL

    document.getElementById(
        "profileEmail"
    ).textContent =
        profile.email ||
        "-";


    // PHONE

    document.getElementById(
        "profilePhone"
    ).textContent =
        profile.phone ||
        "-";


    // ABOUT

    document.getElementById(
        "profileAbout"
    ).textContent =
        profile.about ||
        "No information added yet.";


    // CAREER GOAL

    document.getElementById(
        "profileCareerGoal"
    ).textContent =
        profile.careerGoal ||
        "No career goal added yet.";


    // =================================================
    // PROFILE PHOTO
    // =================================================

    const avatar =
        document.getElementById(
            "profileAvatar"
        );


    avatar.innerHTML =
        "";


    if (
        profile.profilePhoto &&
        profile.profilePhoto.path
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            getFileUrl(
                profile.profilePhoto
            );


        image.alt =
            name;


        avatar.appendChild(
            image
        );

    }

    else {

        avatar.textContent =
            name
                .charAt(0)
                .toUpperCase();

    }


    // =================================================
    // SKILLS
    // =================================================

    const skillsList =
        document.getElementById(
            "skillsList"
        );


    skillsList.innerHTML =
        "";


    if (
        Array.isArray(
            profile.skills
        ) &&
        profile.skills.length
    ) {

        profile.skills.forEach(
            skill => {

                const element =
                    document.createElement(
                        "span"
                    );


                element.className =
                    "skill";


                element.textContent =
                    skill;


                skillsList.appendChild(
                    element
                );

            }
        );

    }

    else {

        skillsList.innerHTML =

            `
                <span class="empty">
                    No skills added yet.
                </span>
            `;

    }


    // =================================================
    // EDUCATION
    // =================================================

    const educationList =
        document.getElementById(
            "educationList"
        );


    educationList.innerHTML =
        "";


    if (
        Array.isArray(
            profile.education
        ) &&
        profile.education.length
    ) {

        profile.education.forEach(
            education => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "education-item";


                const degree =
                    education.degree ||
                    education.field ||
                    "Education";


                const college =
                    education.institution ||
                    "";


                const startYear =
                    education.startYear ||
                    "";


                const endYear =
                    education.endYear ||
                    "";


                let yearText =
                    "";


                if (
                    startYear ||
                    endYear
                ) {

                    yearText =
                        `${startYear} - ${endYear}`;

                }


                item.innerHTML =

                    `
                        <div
                            class="education-degree"
                        >
                            ${escapeHtml(
                                degree
                            )}
                        </div>

                        <div
                            class="education-college"
                        >
                            ${escapeHtml(
                                college
                            )}
                        </div>

                        <div
                            class="education-year"
                        >
                            ${escapeHtml(
                                yearText
                            )}
                        </div>
                    `;


                educationList.appendChild(
                    item
                );

            }
        );

    }

    else {

        educationList.innerHTML =

            `
                <div class="empty">
                    No education added yet.
                </div>
            `;

    }


    // =================================================
    // RESUME
    // =================================================

    const resumeBox =
        document.getElementById(
            "resumeBox"
        );


    const resume =
        profile.resume;


    if (
        resume &&
        resume.path
    ) {

        const filename =
            resume.originalName ||
            resume.filename ||
            resume.fileName ||
            "Resume";


        const url =
            getFileUrl(
                resume
            );


        resumeBox.innerHTML =

            `
                <div
                    class="resume-name"
                >
                    📄 ${escapeHtml(
                        filename
                    )}
                </div>

                <a
                    class="resume-button"
                    href="${escapeHtml(
                        url
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View Resume
                </a>
            `;

    }

    else {

        resumeBox.innerHTML =

            `
                <div class="empty">
                    No resume uploaded.
                </div>
            `;

    }


    // =================================================
    // COMPLETION
    // =================================================

    const completion =
        calculateCompletion(
            profile
        );


    document.getElementById(
        "completionPercent"
    ).textContent =
        `${completion}%`;

}


// =====================================================
// LOAD PROFILE
// =====================================================

async function loadProfile() {

    const userId =
        getUserId();


    if (!userId) {

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "error"
        ).style.display =
            "block";


        document.getElementById(
            "error"
        ).textContent =
            "Profile ID not found.";

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/profile/${encodeURIComponent(userId)}`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load profile."
            );

        }


        renderProfile(
            data.profile
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "profile"
        ).style.display =
            "block";

    }

    catch (error) {

        console.error(
            "Profile preview error:",
            error
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "error"
        ).style.display =
            "block";


        document.getElementById(
            "error"
        ).textContent =
            error.message ||
            "Unable to load profile.";

    }

}


// =====================================================
// COPY PUBLIC PROFILE LINK
// =====================================================

async function copyProfileLink() {

    const currentUrl =
        window.location.href;


    try {

        await navigator.clipboard.writeText(
            currentUrl
        );


        showCopyMessage();

    }

    catch (error) {

        console.error(
            "Clipboard error:",
            error
        );


        // Fallback for browsers
        // where clipboard API is unavailable

        const textArea =
            document.createElement(
                "textarea"
            );


        textArea.value =
            currentUrl;


        textArea.style.position =
            "fixed";

        textArea.style.left =
            "-9999px";


        document.body.appendChild(
            textArea
        );


        textArea.select();


        try {

            document.execCommand(
                "copy"
            );


            showCopyMessage();

        }

        catch (fallbackError) {

            alert(
                "Unable to copy the profile link. Please copy the URL manually."
            );

        }


        document.body.removeChild(
            textArea
        );

    }

}


// =====================================================
// SHOW COPY MESSAGE
// =====================================================

function showCopyMessage() {

    const message =
        document.getElementById(
            "copyMessage"
        );


    message.classList.add(
        "show"
    );


    setTimeout(
        function () {

            message.classList.remove(
                "show"
            );

        },
        2000
    );

}


// =====================================================
// COPY BUTTON
// =====================================================

document
    .getElementById(
        "copyProfileButton"
    )
    .addEventListener(
        "click",
        copyProfileLink
    );


// =====================================================
// BACK BUTTON
// =====================================================

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function () {

            window.location.href =
                "candidate-profile.html";

        }
    );


// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    loadProfile
);

</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const userData =
        localStorage.getItem("hireflowUser");

    let user = null;

    try {
        user = userData
            ? JSON.parse(userData)
            : null;
    } catch (error) {
        console.error("User data error:", error);
    }

    const userId =
        user?.id ||
        user?._id;

    if (!userId) {
        console.error("User ID not found.");
        return;
    }

    /*
     * Create Public Profile button
     */

    const button =
        document.createElement("button");

    button.type = "button";

    button.textContent =
        "View Public Profile →";

    button.style.cssText = `
        margin-left: 12px;
        padding: 14px 22px;
        border: 1px solid #6d4aff;
        border-radius: 10px;
        background: transparent;
        color: #6d4aff;
        font-weight: 600;
        cursor: pointer;
    `;

    button.addEventListener(
        "click",
        function () {

            window.location.href =
                "profile-preview.html?id=" +
                encodeURIComponent(userId);

        }
    );

    /*
     * Put the button near Save Changes
     */

    const saveButton =
        Array.from(
            document.querySelectorAll("button")
        ).find(
            btn =>
                btn.textContent
                    .toLowerCase()
                    .includes("save changes")
        );

    if (saveButton) {

        saveButton.parentElement.appendChild(
            button
        );

    } else {

        document.body.appendChild(
            button
        );

    }

});
</script>
